<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Pozadina -->
  <rect width="200" height="200" rx="40" fill="#6366f1"/>
  
  <!-- Kalendar simbol -->
  <g fill="white">
    <!-- Gornji deo -->
    <rect x="30" y="30" width="140" height="30" rx="5"/>
    
    <!-- Donji deo - grid -->
    <rect x="30" y="70" width="140" height="100" rx="5"/>
    
    <!-- Kvadratići -->
    <rect x="40" y="80" width="20" height="20" fill="#fbbf24"/>
    <rect x="70" y="80" width="20" height="20" fill="#4f46e5"/>
    <rect x="100" y="80" width="20" height="20" fill="#fbbf24"/>
    <rect x="130" y="80" width="20" height="20" fill="#4f46e5"/>
    
    <rect x="40" y="110" width="20" height="20" fill="#4f46e5"/>
    <rect x="70" y="110" width="20" height="20" fill="#fbbf24"/>
    <rect x="100" y="110" width="20" height="20" fill="#4f46e5"/>
    <rect x="130" y="110" width="20" height="20" fill="#fbbf24"/>
    
    <rect x="40" y="140" width="20" height="20" fill="#fbbf24"/>
    <rect x="70" y="140" width="20" height="20" fill="#4f46e5"/>
    <rect x="100" y="140" width="20" height="20" fill="#fbbf24"/>
    <rect x="130" y="140" width="20" height="20" fill="#4f46e5"/>
  </g>
</svg>